name: Compilar APK Android (Reino Pequenino)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: Exportar APK do Godot 4.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Baixar Godot Engine 4.3 e Templates de Exportação
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          rm godot.zip

          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -rf templates templates.tpz

      - name: Gerar Keystore de Debug para Assinatura
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Compilar APK de Debug
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/ReinoPequenino.apk

      - name: Publicar APK como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ReinoPequenino-Android-Debug
          path: build/ReinoPequenino.apk
          retention-days: 14

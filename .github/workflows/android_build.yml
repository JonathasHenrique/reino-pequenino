name: Compilar APK Android (Reino Pequenino)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-android:
    name: Exportar APK do Godot 4.3
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Baixar Godot Engine 4.3 e Templates de Exportação
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -p ~/.local/share/godot/templates/4.3.stable
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          rm godot.zip

          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.3.stable/
          cp -r templates/* ~/.local/share/godot/templates/4.3.stable/
          rm -rf templates templates.tpz

      - name: Gerar Keystore de Debug para Assinatura
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Configurações do Editor Godot (Android SDK & Keystore)
        run: |
          mkdir -p ~/.config/godot
          python3 -c '
          import os
          sdk = os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")
          text = f"""[gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "{sdk}"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          """
          with open(os.path.expanduser("~/.config/godot/editor_settings-4.tres"), "w") as f:
              f.write("\n".join(line.strip() for line in text.strip().splitlines()))
          '

      - name: Importar Assets no Godot Headless
        run: |
          godot --headless --editor --quit || true

      - name: Compilar APK de Debug
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/ReinoPequenino.apk

      - name: Publicar APK como Artefato do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ReinoPequenino-Android-APK
          path: build/ReinoPequenino.apk
          retention-days: 30

      - name: Publicar Release no GitHub (Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ReinoPequenino.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


